name: vmax
services:
  - name: web
    environment_slug: node-js
    github:
      repo: Vishalvivek2007/VMAX
      branch: main
      deploy_on_push: true
    build_command: npm install
    run_command: npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: MONGO_URI
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: API_READ_ACCESS
        scope: RUN_TIME
        type: SECRET
      - key: API_KEY
        scope: RUN_TIME
        type: SECRET
