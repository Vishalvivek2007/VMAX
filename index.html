<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VMAX</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo">V<span>MAX</span></div>
  <ul class="nav-links">
    <li><a href="#" class="active">Home</a></li>
    <li><a href="#">Movies</a></li>
    <li><a href="#">Series</a></li>
    <li><a href="#">My List</a></li>
  </ul>
  <div class="nav-right">
    <button class="nav-icon" aria-label="Search">&#128269;</button>
    <div class="nav-avatar">VS</div>
  </div>
</nav>

<!-- HERO -->
<section class="hero" id="hero-section">
  <div class="hero-bg-fill"></div>
  <div class="hero-glow"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <div class="hero-badge">&#9733; Featured tonight</div>
    <h1 class="hero-title">Loading…</h1>
    <div class="hero-meta">
      <span class="hero-rating">&#9733; —</span>
    </div>
    <p class="hero-desc"></p>
    <div class="hero-actions">
      <button class="btn-play">&#9654;&nbsp; Play Now</button>
      <button class="btn-more">&#8853;&nbsp; More Info</button>
    </div>
  </div>
</section>

<!-- CONTENT SECTIONS -->
<div class="sections">

  <div class="section">
    <div class="section-header">
      <div class="section-title">Trending Today</div>
      <div class="section-tabs">
        <button class="tab active">Movies</button>
        <button class="tab">Series</button>
      </div>
    </div>
    <div class="scroll-row" id="trending-row"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-title">Top 10 This Week</div>
    </div>
    <div class="top10-row" id="top10-row"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-title">New Releases</div>
      <div class="section-tabs">
        <button class="tab active">Movies</button>
        <button class="tab">Series</button>
      </div>
    </div>
    <div class="scroll-row" id="new-row"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-title">Action &amp; Thriller</div>
    </div>
    <div class="scroll-row" id="action-row"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-title">Sci-Fi Universe</div>
    </div>
    <div class="scroll-row" id="scifi-row"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-title">Top Rated All Time</div>
    </div>
    <div class="scroll-row" id="toprated-row"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-title">Comedy Night</div>
    </div>
    <div class="scroll-row" id="comedy-row"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-title">Horror &amp; Suspense</div>
    </div>
    <div class="scroll-row" id="horror-row"></div>
  </div>

</div>

<!-- MOVIE MODAL -->
<!-- This div covers the whole screen when open -->
<div id="movie-modal" class="modal-backdrop">
  <div id="modal-body" class="modal-content"></div>
</div>

<script src="src/scripts.js"></script>
</body>
</html>
